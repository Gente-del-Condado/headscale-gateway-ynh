plugins { id 'com.android.application' version '8.13.0' }
def gatewayVersion = file('../VERSION').text.trim()
def versionParts = gatewayVersion.tokenize('.').collect { it.toInteger() }
def androidRevision = 4
if (versionParts.size() != 3 || versionParts.any { it < 0 } || versionParts[1] > 999 || versionParts[2] > 999) {
    throw new GradleException('La versión común no cabe en el versionCode Android')
}
def androidVersionCode = (versionParts[0] * 1000000L + versionParts[1] * 1000L + versionParts[2]) * 10 + androidRevision
if (androidVersionCode > 2100000000L) {
    throw new GradleException('El versionCode supera el límite de Android')
}
android {
    namespace 'org.headscalegateway.android'
    compileSdk 36
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'org.headscalegateway.android'
        minSdk 24
        targetSdk 36
        versionCode androidVersionCode.intValue()
        versionName gatewayVersion
        testInstrumentationRunner 'org.headscalegateway.android.SmokeInstrumentation'
        ndk { abiFilters.addAll((project.findProperty('targetAbis') ?: 'arm64-v8a,x86_64').split(',')) }
        externalNativeBuild { ndkBuild { arguments 'NDK_APPLICATION_MK:=src/main/jni/Application.mk'; targets 'gateway-tunnel' } }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    externalNativeBuild { ndkBuild { path file('src/main/jni/Android.mk') } }
    sourceSets.main.jniLibs.srcDirs = ['../builds/android-jni']
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += '**/libheadscale_gateway.so' } }
    buildTypes {
        debug { applicationIdSuffix project.hasProperty('labBuild') ? '.lab' : '.dev'; versionNameSuffix '-pruebas' }
        release {
            minifyEnabled false
            // La firma estable se proporciona fuera de Git; nunca se usa la clave de depuración para publicar.
            if (project.findProperty('releaseChannel') != 'fdroid' && System.getenv('HGW_ANDROID_KEYSTORE')) {
                signingConfigs.create('privateRelease') {
                    storeFile file(System.getenv('HGW_ANDROID_KEYSTORE'))
                    storePassword System.getenv('HGW_ANDROID_STORE_PASSWORD')
                    keyAlias System.getenv('HGW_ANDROID_KEY_ALIAS')
                    keyPassword System.getenv('HGW_ANDROID_KEY_PASSWORD')
                }
                signingConfig signingConfigs.privateRelease
            }
        }
    }
}
