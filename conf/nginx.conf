#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT__/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host "";
    # SSOwat v12 elimina las cabeceras Ynh-* del cliente y añade la identidad verificada.
    proxy_set_header Ynh-User $http_ynh_user;
    include /etc/nginx/conf.d/__DOMAIN__.d/__APP__-proxy-auth.inc;
    proxy_set_header Authorization "";
    proxy_set_header Remote-User "";
    proxy_set_header X-Remote-User-Id "";
    proxy_redirect off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 1024m;
    proxy_request_buffering off;
}
