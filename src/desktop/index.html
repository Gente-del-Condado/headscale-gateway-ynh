<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'"><title>Gateway</title><link rel="stylesheet" href="style.css"></head>
<body><header><span class="logo">G</span><strong>Gateway</strong><button id="hide" class="icon" aria-label="Ocultar">×</button></header>
<main id="dashboard"><section class="connection"><div class="status-row"><h1 id="status">Sin conexión</h1><button id="refresh" class="icon" aria-label="Actualizar">↻</button></div><p id="message" role="status"></p><small id="updated"></small></section>
<section><h2>Solicitudes de rutas <span id="count" class="badge">0</span></h2><ul id="requests"></ul></section>
<details id="node-details"><summary>Equipos <span id="total" class="badge">0</span></summary><input id="search" type="search" placeholder="Buscar nombre, usuario o IP" aria-label="Buscar equipos"><ul id="nodes"></ul></details>
<nav class="actions"><button id="open">Abrir administración ↗</button><button id="preferences">Preferencias</button></nav></main>
<main id="preferences-view" hidden><div class="page-title"><button id="back" class="icon" aria-label="Volver">‹</button><h1>Preferencias</h1></div>
<label>Idioma<select id="language"></select></label>
<form id="config"><label>Dirección del Gateway<input id="url" type="url" required value="http://127.0.0.1:9091"></label><label>Token API del Gateway<input id="token" type="password" autocomplete="off" placeholder="Token viewer · ámbitos read y network"></label><p class="hint">Créalo en API / Permisos del panel. No uses la clave de Headscale.</p><label class="check"><input id="remember" type="checkbox"> Recordar token en el almacén seguro</label><label class="check"><input id="notifications" type="checkbox"> Notificar rutas pendientes y desconexiones</label><p id="storage" class="hint"></p><button class="primary">Guardar y conectar</button><div class="secondary-actions"><button id="test-notification" type="button">Probar aviso</button><button id="disconnect" type="button">Desconectar y olvidar token</button></div></form><p class="hint">Cerrar oculta el panel. Para terminar, usa Salir en la bandeja.</p></main>
<p id="error" role="alert"></p><script src="renderer.js"></script></body></html>
